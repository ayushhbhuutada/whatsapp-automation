version: '3.8'

services:
  openwa-gateway:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa_gateway
    ports:
      - "2785:2785"
    environment:
      - PORT=2785
      - DEFAULT_ENGINE=whatsapp-web.js
    restart: unless-stopped

  whatsapp-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_automation_saas
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=whatsapp-saas-production-jwt-secret-key-2026
      - OPENWA_URL=http://openwa-gateway:2785
      - OPENWA_ENGINE=whatsapp-web.js
      - RAZORPAY_KEY_ID=
      - RAZORPAY_KEY_SECRET=
    depends_on:
      - openwa-gateway
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./attachments:/app/attachments
    restart: unless-stopped
