appId: com.whatsapp.automation.pro
productName: WhatsApp Automation
electronVersion: 30.0.0
artifactName: WhatsAppAutomationSetup.${ext}
directories:
  output: dist_electron
  buildResources: electron
files:
  - electron/**/*
  - backend/**/*
  - frontend/dist/**/*
  - database/**/*
  - "!database/*.anchor"
  - "!database/license.json"
  - "!**/*.anchor"
  - package.json
asar: false
forceCodeSigning: false
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: WhatsAppAutomation
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WhatsApp Automation
  uninstallDisplayName: WhatsApp Automation
  deleteAppDataOnUninstall: false
  runAfterFinish: true
