<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Automator Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 0%, #0f172a, #020617 80%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(16, 185, 129, 0.15);
      position: relative;
    }
    .logo-container {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #10b981 0%, #0d9488 50%, #047857 100%);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 3px;
    }
    .subtitle {
      font-size: 9px;
      font-weight: 700;
      color: #34d399;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .progress-track {
      width: 280px;
      height: 5px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #059669, #10b981, #34d399);
      border-radius: 99px;
      position: absolute;
      left: 0;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-bar.indeterminate {
      width: 30%;
      animation: move-bar 1.5s infinite ease-in-out;
    }
    @keyframes move-bar {
      0% { left: -40%; width: 30%; }
      50% { left: 25%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    .status-text {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 500;
      transition: all 0.2s ease;
      text-align: center;
      max-width: 340px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .version-tag {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 9px;
      color: #475569;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </div>
  <div class="title">WhatsApp Automator Pro</div>
  <div class="subtitle">Commercial Desktop Edition</div>
  
  <div class="status-badge" id="badge">
    <div class="status-dot" id="dot"></div>
    <span id="badge-text">Auto-Update System Active</span>
  </div>

  <div class="progress-track">
    <div class="progress-bar indeterminate" id="bar"></div>
  </div>
  
  <div class="status-text" id="status">Checking for updates...</div>
  <div class="version-tag" id="version">v1.0.0</div>

  <script>
    function updateStatus(msg, percent) {
      const statusEl = document.getElementById('status');
      const barEl = document.getElementById('bar');
      const badgeText = document.getElementById('badge-text');

      if (statusEl) statusEl.textContent = msg;
      
      if (typeof percent === 'number' && percent >= 0) {
        if (barEl) {
          barEl.classList.remove('indeterminate');
          barEl.style.width = Math.min(100, Math.max(0, percent)) + '%';
        }
        if (badgeText) badgeText.textContent = `Downloading Update: ${percent}%`;
      } else {
        if (barEl) {
          barEl.classList.add('indeterminate');
          barEl.style.width = '';
        }
      }
    }

    window.updateStatus = updateStatus;
  </script>
</body>
</html>
